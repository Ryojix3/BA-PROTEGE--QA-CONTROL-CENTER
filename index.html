asos iniciales','','seed')} ${btn('＋ Crear ejecución','primary','newrun')}</div></section>`}

function deletedCasesPage(){
 const archived=state.cases.filter(c=>c.is_active===false);
 // Una sola fila visible por case_key. Si existen filas duplicadas históricas,
 // se muestra la que tenga la fecha de archivado más reciente.
 const unique=new Map();
 for(const c of archived){const key=String(c.case_key||c.id).trim().toLowerCase();const prev=unique.get(key);const t=x=>new Date(x.archived_at||0).getTime()||0;if(!prev||t(c)>t(prev))unique.set(key,c)}
 const items=[...unique.values()].sort((a,b)=>(new Date(b.archived_at||0).getTime()||0)-(new Date(a.archived_at||0).getTime()||0));
 const age=value=>{if(!value)return 'Fecha no disponible';const ms=Math.max(0,Date.now()-new Date(value).getTime());const m=Math.floor(ms/60000);if(m<1)return 'Hace menos de 1 minuto';if(m<60)return `Hace ${m} minuto${m===1?'':'s'}`;const h=Math.floor(m/60);if(h<24)return `Hace ${h} hora${h===1?'':'s'}`;const d=Math.floor(h/24);if(d<30)return `Hace ${d} día${d===1?'':'s'}`;return new Date(value).toLocaleString('es-AR')};
 return heading('RECUPERACIÓN DE CASOS','Casos eliminados','Los casos archivados se muestran una sola vez y del más reciente al más antiguo.',btn('← Volver al catálogo','','cases'))+
 `<section class="panel"><div class="panel-head"><div><h2>${items.length} casos archivados</h2><p class="panel-sub">Restaurar devuelve el caso al catálogo sin borrar sus resultados ni sus relaciones históricas.</p></div></div><div class="tablewrap"><table><thead><tr><th>ID / TÍTULO</th><th>MÓDULO</th><th>ELIMINADO</th><th>ACCIÓN</th></tr></thead><tbody>${items.map(c=>`<tr><td><strong>${esc(c.case_key)}</strong><div class="titlecell">${esc(c.title)}</div><p class="panel-sub">${esc(c.description||'')}</p></td><td>${esc(c.module||'')}</td><td><b>${esc(age(c.archived_at))}</b>${c.archived_at?`<div class="panel-sub">${esc(new Date(c.archived_at).toLocaleString('es-AR'))}</div>`:''}</td><td><button class="btn primary" data-restore-case="${esc(c.id)}">Restaurar</button></td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">La papelera está vacía. Los casos que archives aparecerán aquí.</div>'}</div><p class="footnote">Los casos archivados no se incluyen en el catálogo activo ni en nuevas ejecuciones. Restaurarlos no modifica ejecuciones anteriores.</p></section>`
}

async function refreshData(){const [c,r,res,d,s,sc]=await Promise.all([qaSupabase.from('qa_test_cases').select('*').order('case_key'),qaSupabase.from('qa_test_runs').select('*').order('created_at'),qaSupabase.from('qa_test_results').select('*').order('created_at'),qaSupabase.from('qa_defects').select('*').order('created_at'),qaSupabase.from('qa_test_suites').select('*').order('name'),qaSupabase.from('qa_test_suite_cases').select('*')]);for(const x of [c,r,res,d,s,sc])if(x.error)throw x.error;state={cases:c.data||[],runs:r.data||[],results:res.data||[],defects:d.data||[],suites:s.data||[],suiteCases:sc.data||[]};let nums=state.defects.map(x=>Number(String(x.bug_key||'').match(/(\d+)$/)?.[1]||0));state.nextBug=Math.max(1,...nums)+1;if(!selectedRun&&state.runs.length)selectedRun=state.runs[state.runs.length-1].id;}

document.addEventListener('change',async e=>{if(e.target.id==='caseImportInput'&&e.target.files?.length){try{const file=e.target.files[0],ext=file.name.split('.').pop().toLowerCase();let raw=[];if(ext==='json'){const j=JSON.parse(await file.text());raw=Array.isArray(j)?j:(Array.isArray(j.cases)?j.cases:[])}else if(ext==='csv'){const wb=XLSX.read(await file.text(),{type:'string'});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else if(ext==='xlsx'){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else throw new Error('Formato no soportado. Usá XLSX, CSV o JSON.');if(!raw.length)throw new Error('El archivo no contiene filas.');const aliases={id:'case_key',case_id:'case_key',test_case_id:'case_key',nombre:'title',titulo:'title',titulo_del_caso:'title',descripcion:'description',descripcion_del_caso:'description',modulo:'module',nombre_del_modulo:'module',tipo:'test_type',prioridad:'priority',precondiciones:'preconditions',pasos:'steps',pasos_de_prueba:'steps',resultado_esperado:'expected_result',esperado:'expected_result',referencia:'requirement_ref',referencia_requisito:'requirement_ref',categorias:'categories',categoria:'categories'};const normalized=raw.map(row=>{let o={};for(const [k,v] of Object.entries(row)){let key=String(k).replace(/^\uFEFF/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s-]+/g,'_');key=aliases[key]||key;o[key]=v}return o});const byKey=new Map();const ambiguous=new Set();for(const existingCase of state.cases){const k=String(existingCase.case_key||'').trim().toLowerCase();if(!k)continue;if(byKey.has(k))ambiguous.add(k);else byKey.set(k,existingCase)}const seen=new Set();let added=0,updated=0,duplicates=0,invalid=0,ambiguousCount=0;const inserts=[],updates=[];for(const c of normalized){const key=String(c.case_key||'').trim().toLowerCase();if(!key||!String(c.title||'').trim()||!String(c.description||'').trim()||!String(c.module||'').trim()||!String(c.steps||'').trim()||!String(c.expected_result||'').trim()){invalid++;continue}if(seen.has(key)){duplicates++;continue}seen.add(key);if(ambiguous.has(key)){ambiguousCount++;continue}const payload={title:String(c.title).trim(),description:String(c.description).trim(),module:String(c.module).trim(),test_type:String(c.test_type||'Funcional').trim(),priority:String(c.priority||'Media').trim(),preconditions:String(c.preconditions||'').trim(),steps:String(c.steps).trim(),expected_result:String(c.expected_result).trim(),requirement_ref:String(c.requirement_ref||'').trim(),categories:Array.isArray(c.categories)?c.categories:(typeof c.categories==='string'?c.categories.split(/[;,|]/).map(x=>x.trim()).filter(Boolean):[])};const match=byKey.get(key);if(match){updates.push({id:match.id,payload})}else{inserts.push({case_key:String(c.case_key).trim(),...payload,created_by:user.id,is_active:true})}}if(updates.length||inserts.length){const summary=`Se encontraron ${updates.length} casos existentes para actualizar y ${inserts.length} casos nuevos para agregar.${ambiguousCount?`\n\nHay ${ambiguousCount} IDs repetidos dentro del catálogo; esos registros se omitirán para evitar modificar el caso equivocado.`:''}${duplicates?`\nSe ignorarán ${duplicates} filas repetidas dentro del archivo.`:''}${invalid?`\nSe ignorarán ${invalid} filas incompletas o inválidas.`:''}\n\nLa actualización no modifica IDs internos, suites, ejecuciones, resultados históricos ni el estado activo/archivado. ¿Querés continuar?`;if(!window.confirm(summary)){notice='Importación cancelada. No se realizaron cambios.';render();return}for(const item of updates){const {error}=await qaSupabase.from('qa_test_cases').update(item.payload).eq('id',item.id);if(error)throw error;updated++}if(inserts.length){const {error}=await qaSupabase.from('qa_test_cases').insert(inserts);if(error)throw error;added=inserts.length}}else if(!invalid&&!duplicates&&!ambiguousCount){notice='El archivo no contiene casos para importar.';render();return}await refreshData();page='cases';notice=`Importación finalizada: ${added} casos agregados, ${updated} actualizados, ${duplicates} filas repetidas omitidas, ${ambiguousCount} IDs ambiguos omitidos y ${invalid} filas inválidas.`;render()}catch(err){showError('No se pudo importar el archivo: '+err.message)}finally{e.target.value=''}}});

document.addEventListener('change',async e=>{if(e.target.id==='membershipImportInput'&&e.target.files?.length){try{const wb=XLSX.read(await e.target.files[0].text(),{type:'string'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('El CSV no contiene relaciones.');let added=0,missing=0;for(const row of rows){const suiteName=String(row.suite_name||row.nombre_suite||'').trim(),caseKey=String(row.case_key||row.id_caso||'').trim();if(!suiteName||!caseKey){missing++;continue}let suite=state.suites.find(x=>x.name.toLowerCase()===suiteName.toLowerCase());if(!suite){const {data,error}=await qaSupabase.from('qa_test_suites').insert({name:suiteName,description:String(row.purpose||row.proposito||''),created_by:user.id}).select().single();if(error)throw error;suite=data;state.suites.push(suite)}const testCase=state.cases.find(x=>x.case_key.toLowerCase()===caseKey.toLowerCase());if(!testCase){missing++;continue}const exists=state.suiteCases.some(x=>String(x.suite_id)===String(suite.id)&&String(x.test_case_id)===String(testCase.id));if(exists)continue;const {error}=await qaSupabase.from('qa_test_suite_cases').insert({suite_id:suite.id,test_case_id:testCase.id});if(error)throw error;added++}await refreshData();page='suites';notice=`Pertenencia importada: ${added} relaciones nuevas; ${missing} filas sin suite o caso válido. Las relaciones existentes se conservaron.`;render()}catch(err){showError('No se pudo importar la pertenencia a suites: '+err.message)}finally{e.target.value=''}}});
document.addEventListener('change',async e=>{if(e.target.id!=='bugImportInput'||!e.target.files?.length)return;try{const parsed=JSON.parse(await e.target.files[0].text());const incoming=Array.isArray(parsed)?parsed:(parsed?.format==='ba-protege-qa-bugs'&&Array.isArray(parsed.bugs)?parsed.bugs:(Array.isArray(parsed?.defects)?parsed.defects:null));if(!incoming)throw new Error('El archivo no contiene una lista de bugs reconocible.');let added=0,skipped=0;const fingerprints=new Set(state.defects.map(bugFingerprint));const rows=[];let next=state.nextBug;for(const raw of incoming){if(!raw||!String(raw.title||'').trim()){skipped++;continue}if(fingerprints.has(bugFingerprint(raw))){skipped++;continue}fingerprints.add(bugFingerprint(raw));rows.push({bug_id:raw.bugId||makeBugId(),bug_key:'BUG-'+String(next++).padStart(4,'0'),title:String(raw.title).trim(),description:raw.description||'',level_area:raw.levelArea||raw.level_area||'',severity:raw.severity||'Major',status:raw.status||'OPEN',steps:raw.steps||'',actual:raw.actual||'',expected_behavior:raw.expectedBehavior||raw.expected_behavior||'',additional_notes:raw.additionalNotes||raw.additional_notes||'',attachments:Array.isArray(raw.attachments)?raw.attachments:[],component:raw.component||'',affects_version:raw.affectsVersion||raw.affects_version||'',fix_version:raw.fixVersion||raw.fix_version||'',platform:raw.platform||'Android',reproduction_rate:raw.reproductionRate||raw.reproduction_rate||'',created_by:user.id});added++}if(rows.length){const {error}=await qaSupabase.from('qa_defects').insert(rows);if(error)throw error}await refreshData();page='defects';notice=`Importación completada: ${added} bugs nuevos, ${skipped} omitidos (duplicados o inválidos).`;render()}catch(err){showError('No se pudo importar: '+err.message)}finally{e.target.value=''}});
document.addEventListener('change',function(e){if(e.target&&e.target.id&&e.target.id.startsWith('status-')){const id=e.target.id.slice(7),card=e.target.closest('.execitem');if(!card)return;['pass','fail','blocked','not_run','skipped'].forEach(x=>{card.classList.remove('status-'+x);e.target.classList.remove('status-select-'+x)});const st=String(e.target.value||'NOT_RUN').toLowerCase();card.classList.add('status-'+st);e.target.classList.add('status-select-'+st);const pill=card.querySelector('.status-pill');if(pill){pill.className='status-pill status-pill-'+st;pill.textContent=({pass:'APROBADO',fail:'FALLIDO',blocked:'BLOQUEADO',not_run:'PENDIENTE',skipped:'OMITIDO'})[st]||st}const quick=card.querySelector('.exec-create-bug');if(quick)quick.style.display=st==='fail'?'':'none';}});

te().eq('suite_id',selectedSuite);if(delError)throw delError}else{const {data:created,error}=await qaSupabase.from('qa_test_suites').insert({name:data.name,description:data.description||'',created_by:user.id}).select().single();if(error)throw error;suite=created}const rows=ids.map(case_id=>({suite_id:suite.id,test_case_id:case_id}));const {error:linkError}=await qaSupabase.from('qa_test_suite_cases').insert(rows);if(linkError)throw linkError;await refreshData();selectedSuite=suite.id;page='suites';showRun=false;notice='Suite guardada correctamente.';render()}if(f.id==='runform'){ const data=Object.fromEntries(new FormData(f));const selectedSuiteId=data.suite_id||null;const selectedIds=selectedSuiteId?state.suiteCases.filter(x=>String(x.suite_id)===String(selectedSuiteId)).map(x=>String(x.test_case_id)):[...f.querySelectorAll('input[name=case_ids]:checked')].map(x=>x.value);if(!selectedIds.length)throw new Error('La selección no contiene casos. Elegí una suite con casos o seleccioná casos manualmente.');const {data:run,error}=await qaSupabase.from('qa_test_runs').insert({name:data.name,build:data.build,environment:data.environment,suite_id:selectedSuiteId,created_by:user.id}).select().single();if(error)throw error;const chosen=state.cases.filter(c=>selectedIds.includes(String(c.id)));const rows=chosen.map(c=>({run_id:run.id,case_id:c.id,status:'NOT_RUN',actual:'',comment:'',case_snapshot:c,created_by:user.id}));if(rows.length){const {error:resultError}=await qaSupabase.from('qa_test_results').insert(rows);if(resultError)throw resultError}await refreshData();selectedRun=run.id;page='runs';showRun=false;runFromSuiteId=null;notice=`Ejecución creada con ${rows.length} casos seleccionados.`;render()}if(f.id==='bugform'){const fd=new FormData(f),data=Object.fromEntries(fd),attachments=[...(f.elements.attachments.files||[])].map(file=>file.name);const {error}=await qaSupabase.from('qa_defects').insert({bug_id:makeBugId(),bug_key:'BUG-'+String(state.nextBug++).padStart(4,'0'     const ids=new Set(state.suiteCases.filter(x=>String(x.suite_id)===String(suiteId)).map(x=>String(x.test_case_id)));

// Selección acumulativa con feedback visual persistente en Nueva suite.
function syncSuiteCategoryButtons(){
  const form=document.getElementById('suiteform');
  if(!form) return;
  const checked=new Set([...form.querySelectorAll('input[name="suite_case_ids"]:checked')].map(x=>String(x.value)));
  form.querySelectorAll('[data-suite-category]').forEach(btn=>{
    const category=btn.getAttribute('data-suite-category');
    const ids=state.cases.filter(c=>c.is_active!==false && caseCategories(c).some(cat=>String(cat).trim().toLocaleLowerCase('es')===String(category).trim().toLocaleLowerCase('es'))).map(c=>String(c.id));
    const selected=ids.filter(id=>checked.has(id)).length;
    btn.classList.toggle('suite-cat-selected',ids.length>0 && selected===ids.length);
    btn.classList.toggle('suite-cat-partial',selected>0 && selected<ids.length);
    const label=btn.getAttribute('data-category-label') || btn.textContent.replace(/^[＋+✓]\s*/,'').replace(/\s+\(\d+\)$/,'');
    btn.setAttribute('data-category-label',label);
    btn.textContent=(ids.length>0 && selected===ids.length?'✓ ':'＋ ')+label+` (${ids.length})`;
    btn.setAttribute('aria-pressed',String(ids.length>0 && selected===ids.length));
  });
  const count=checked.size;
  const counter=document.getElementById('suiteSelectedCaseCount');
  if(counter) counter.textContent=`${count} seleccionados`;
}
document.addEventListener('click',function(e){
  const categoryButton=e.target.closest('[data-suite-category]');
  const clearButton=e.target.closest('[data-suite-clear-categories]');
  if(!categoryButton && !clearButton) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  const form=document.getElementById('suiteform');
  if(!form) return;
  const boxes=[...form.querySelectorAll('input[name="suite_case_ids"]')];
  if(clearButton){
    boxes.forEach(x=>{x.checked=false});
    const feedback=document.getElementById('suiteCategoryFeedback');
    if(feedback) feedback.textContent='Selección limpiada.';
  } else {
    const category=categoryButton.getAttribute('data-suite-category');
    const norm=v=>String(v??'').trim().toLocaleLowerCase('es');
    const matching=state.cases.filter(c=>c.is_active!==false && caseCategories(c).some(cat=>norm(cat)===norm(category))).map(c=>String(c.id));
    let added=0;
    boxes.forEach(x=>{if(matching.includes(String(x.value))&&!x.checked){x.checked=true;added++;}});
    const feedback=document.getElementById('suiteCategoryFeedback');
    if(feedback) feedback.textContent=matching.length ? `${matching.length} casos de "${category}" seleccionados; ${added} nuevos agregados a la selección.` : `No se encontraron casos activos para "${category}".`;
  }
  syncSuiteCategoryButtons();
},true);
document.addEventListener('change',function(e){
  if(e.target.matches('#suiteform input[name="suite_case_ids"]')) syncSuiteCategoryButtons();
},true);
