:5}.modal{width:min(680px,100%);max-height:calc(100vh - 40px);overflow-y:auto;background:white;border-radius:13px;padding:23px}.modal h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:7px;margin:12px 0;font-size:11px;font-weight:700;color:#526b77}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:75px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.defectrow{padding:13px 0;border-bottom:1px solid #edf1f3}.defectrow b{font-size:11px}.defectrow p{font-size:11px;color:#7b8b94}.empty{padding:25px;text-align:center;color:#81919a;font-size:12px}.noticebox{font-size:11px;color:#7e8e97;line-height:1.6}.footnote{font-size:10px;color:#87969e;line-height:1.6;margin-top:12px}

<script>
// Supabase public client configuration. Publishable/anon key is intended for browser use.
const SUPABASE_URL = 'https://hxbtabaivgrcvruvkqmn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZeiORu2bkH50quaBtB5VRg_OA2U_mrP';
const qaSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null, state={cases:[],runs:[],results:[],defects:[],suites:[],suiteCases:[],nextBug:1};
let selectedSuite=null, importPreview=[], editingCaseId=null;
let page='dashboard',selectedRun=null,notice='',showRun=false,search='',moduleFilter='Todos',busy=false;
const setNotice=(msg)=>{notice=msg;render()};
function loginView(error=''){return `<div class="auth-screen"><form class="auth-card" id="loginform"><div class="mark">✓</div><div class="eyebrow">BA PROTEGE+ · ESPACIO QA</div><h1>Centro de control QA</h1><p>Ingresá con tu cuenta autorizada para acceder al espacio compartido de testing.</p><label class="field">Correo electrónico<input name="email" type="email" required autocomplete="username" placeholder="nombre@empresa.com"></label><label class="field">Contraseña<input name="password" type="password" required autocomplete="current-password" placeholder="Tu contraseña"></label><button class="btn primary" type="submit">Iniciar sesión</button>${error?`<div class="auth-error">${esc(error)}</div>`:''}<p class="footnote">Acceso exclusivo para miembros autorizados del equipo QA.</p></form></div>`}
function nav(){return `<aside class="side"><div class="brand"><div class="mark">✓</div><div><b>BA Protege+</b><small>Centro de control QA</small></div></div><div class="muted-label">ESPACIO DE TRABAJO</div><div class="project">● Protección parental</div><div class="nav">${[['dashboard','▦','Panel'],['cases','☷','Casos de prueba'],['deleted','▤','Casos eliminados'],['suites','▣','Suites'],['runs','▷','Ejecuciones'],['defects','⚑','Defectos'],['reports','▤','Reportes'],['howto','ⓘ','How to']].map(([id,ico,label])=>`<button class="${page===id?'active':''}" data-page="${id}"><span>${ico}</span><span>${label}</span></button>`).join('')}</div><div class="sidefoot">QA Workspace · Datos compartidos en Supabase</div></aside>`}
function heading(k,title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function btn(label,cls,action){return `<button class="btn ${cls||''}" data-action="${action}">${label}</button>`}
function stats(){let statuses=state.results.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{});let open=state.defects.filter(d=>!['CLOSED','RESOLVED'].includes(d.status));return `<div class="stats">${[['Casos de prueba',state.cases.filter(c=>c.is_active!==false).length,'Casos activos en catálogo'],['Ejecuciones',state.runs.length,'Sesiones registradas'],['Bugs abiertos',open.length,'Pendientes de resolución'],['Bugs críticos',open.filter(d=>['Critical','Blocker'].includes(d.severity)).length,'Riesgo de release']].map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
function dashboard(){let latestRun=state.runs.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];let latestResults=latestRun?state.results.filter(r=>r.run_id===latestRun.id):[];let statuses=latestResults.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{}),pass=statuses.PASS||0,fail=statuses.FAIL||0,rate=pass+fail?Math.round(pass/(pass+fail)*100):0;return heading('RESUMEN DE QA','Panel','Estado de calidad y actividad de testing de BA Protege+.',btn('＋ Nueva ejecución','primary','newrun'))+stats()+`<div class="two"><section class="panel"><h2>Resultados de testing</h2><p class="panel-sub">${latestRun?'Última ejecución: '+esc(latestRun.name):'Todavía no hay ejecuciones'}</p><div style="display:flex;align-items:center;justify-content:space-between;padding:25px 12px"><div><strong style="font-size:32px;color:#16815e">${rate}%</strong><div class="panel-sub">Pass rate</div></div><div style="font-size:28px;color:#2b5966">${latestResults.length}</div></div>${[['PASS',pass,'#15966b'],['FAIL',fail,'#d9485f'],['BLOCKED',statuses.BLOCKED||0,'#d99a24'],['NOT RUN',statuses.NOT_RUN||0,'#98a2b3']].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bar"><i style="width:${latestResults.length?x[1]/latestResults.length*100:0}%;background:${x[2]}"></i></div><b>${x[1]}</b></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h2>Actividad reciente</h2><p class="panel-sub">Últimas ejecuciones</p></div>${btn('Ver todas','','runs')}</div>${state.runs.slice().reverse().slice(0,5).map(r=>`<div class="defectrow"><b>${esc(r.name)}</b><p>Build ${esc(r.build)} · ${esc(r.environment)}</p></div>`).join('')||'<div class="empty">Todavía no hay ejecuciones.</div>'}</section></div><section class="panel quick"><div><div class="eyebrow">PRIMEROS PASOS</div><h2 style="margin-top:8px">Prepará tu espacio de QA</h2><p>Cargá los casos base derivados del brief y creá una ejecución para registrar resultados manuales de Android.</p></div><div>${btn('⇩ Cargar casos iniciales','','seed')} ${btn('＋ Crear ejecución','primary','newrun')}</div></section>`}
function casesPage(){let mods=['Todos',...new Set(state.cases.filter(c=>c.is_active!==false).map(c=>c.module).filter(Boolean))];let filtered=state.cases.filter(c=>c.is_active!==false&&(moduleFilter==='Todos'||c.module===moduleFilter)&&`${c.case_key} ${c.title} ${c.module}`.toLowerCase().includes(search.toLowerCase()));return heading('GESTIÓN DE PRUEBAS','Casos de prueba','Catálogo de escenarios de BA Protege+.',`<div style="display:flex;gap:8px;flex-wrap:wrap">${btn('＋ Crear escenario','primary','newCase')} ${btn('♲ Casos eliminados ('+state.cases.filter(c=>c.is_active===false).length+')','','deleted')} ${btn('⇧ Importar casos','','importCases')} ${btn('⇩ Plantilla XLSX','','templateXlsx')} ${btn('⇩ Plantilla CSV','','templateCsv')} ${btn('⇩ Plantilla JSON','','templateJson')} ${btn('⇩ Importar pertenencia a suites','','importMembership')}</div>`)+`<input id="caseImportInput" type="file" accept=".xlsx,.csv,.json,application/json,text/csv" hidden><input id="membershipImportInput" type="file" accept=".csv,text/csv" hidden><section class="panel"><div class="filters"><input id="search" placeholder="Buscar por ID, título o módulo..." value="${esc(search)}"><select id="moduleFilter">${mods.map(m=>`<option ${m===moduleFilter?'selected':''}>${esc(m)}</option>`).join('')}</select><span class="count">${filtered.length} casos activos</span></div><div class="tablewrap"><table><thead><tr><th>ID / TÍTULO</th><th>MÓDULO</th><th>TIPO</th><th>PRIORIDAD</th><th>REFERENCIA</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><strong>${esc(c.case_key)}</strong><div class="titlecell">${esc(c.title)}</div><p class="panel-sub">${esc(c.description||'')}</p><details><summary>Ver descripción, precondiciones, pasos y resultado</summary><p><b>Descripción:</b> ${esc(c.description||'')}</p><p><b>Precondiciones:</b> ${esc(c.preconditions||'No definidas')}</p><p><b>Pasos:</b><br>${esc(c.steps||'').replace(/\n/g,'<br>')}</p><p><b>Resultado esperado:</b> ${esc(c.expected_result||'')}</p></details><div class="case-actions"><button class="btn" data-edit-case="${c.id}">Editar</button><button class="btn danger" data-archive-case="${c.id}">Eliminar del catálogo</button></div></td><td>${esc(c.module)}</td><td><span class="pill">${esc(c.test_type)}</span></td><td><span class="priority">● ${esc(c.priority)}</span></td><td>${esc(c.requirement_ref||'')}</td></tr>`).join('')}</tbody></table>${filtered.length?'':'<div class="empty">No hay casos activos que coincidan con la búsqueda.</div>'}</div><p class="footnote">Eliminar un caso lo archiva del catálogo. No se borran ejecuciones ni resultados históricos.</p></section>`}
function deletedCasesPage(){
 const archived=state.cases.filter(c=>c.is_active===false);
 // Una sola fila visible por case_key. Si existen filas duplicadas históricas,
 // se muestra la que tenga la fecha de archivado más reciente.
 const unique=new Map();
 for(const c of archived){const key=String(c.case_key||c.id).trim().toLowerCase();const prev=unique.get(key);const t=x=>new Date(x.archived_at||0).getTime()||0;if(!prev||t(c)>t(prev))unique.set(key,c)}
 const items=[...unique.values()].sort((a,b)=>(new Date(b.archived_at||0).getTime()||0)-(new Date(a.archived_at||0).getTime()||0));
 const age=value=>{if(!value)return 'Fecha no disponible';const ms=Math.max(0,Date.now()-new Date(value).getTime());const m=Math.floor(ms/60000);if(m<1)return 'Hace menos de 1 minuto';if(m<60)return `Hace ${m} minuto${m===1?'':'s'}`;const h=Math.floor(m/60);if(h<24)return `Hace ${h} hora${h===1?'':'s'}`;const d=Math.floor(h/24);if(d<30)return `Hace ${d} día${d===1?'':'s'}`;return new Date(value).toLocaleString('es-AR')};
 return heading('RECUPERACIÓN DE CASOS','Casos eliminados','Los casos archivados se muestran una sola vez y del más reciente al más antiguo.',btn('← Volver al catálogo','','cases'))+
 `<section class="panel"><div class="panel-head"><div><h2>${items.length} casos archivados</h2><p class="panel-sub">Restaurar devuelve el caso al catálogo sin borrar sus resultados ni sus relaciones históricas.</p></div></div><div class="tablewrap"><table><thead><tr><th>ID / TÍTULO</th><th>MÓDULO</th><th>ELIMINADO</th><th>ACCIÓN</th></tr></thead><tbody>${items.map(c=>`<tr><td><strong>${esc(c.case_key)}</strong><div class="titlecell">${esc(c.title)}</div><p class="panel-sub">${esc(c.description||'')}</p></td><td>${esc(c.module||'')}</td><td><b>${esc(age(c.archived_at))}</b>${c.archived_at?`<div class="panel-sub">${esc(new Date(c.archived_at).toLocaleString('es-AR'))}</div>`:''}</td><td><button class="btn primary" data-restore-case="${esc(c.id)}">Restaurar</button></td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">La papelera está vacía. Los casos que archives aparecerán aquí.</div>'}</div><p class="footnote">Los casos archivados no se incluyen en el catálogo activo ni en nuevas ejecuciones. Restaurarlos no modifica ejecuciones anteriores.</p></section>`
}
function newRun(){showRun=true;render()}
function runsPage(){let r=state.runs.find(x=>x.id===selectedRun);let results=state.results.filter(x=>x.run_id===selectedRun);return heading('EJECUCIÓN DE PRUEBAS','Ejecuciones manuales','Registrá resultados por build sin perder el historial.',btn('＋ Nueva ejecución','primary','newrun'))+`<div class="runlayout"><section class="panel"><h2>Sesiones</h2>${state.runs.slice().reverse().map(x=>`<div class="run-entry"><button class="runchoice ${selectedRun===x.id?'selected':''}" data-run="${x.id}"><b>${esc(x.name)}</b><span>Build ${esc(x.build)}</span></button><button class="run-delete" data-delete-run="${x.id}" title="Eliminar ejecución" aria-label="Eliminar ejecución">Eliminar</button></div>`).join('')||'<div class="empty">No hay sesiones creadas.</div>'}</section><section class="panel"><div class="panel-head"><div><h2>${r?esc(r.name):'Seleccioná una ejecución'}</h2><p class="panel-sub">${r?'Build '+esc(r.build)+' · '+esc(r.environment):'Creá una ejecución para habilitar resultados.'}</p></div></div>${r?`<div class="barrow" style="grid-template-columns:repeat(4,1fr);margin:18px 0">${['PASS','FAIL','BLOCKED','NOT_RUN'].map(s=>`<div><span>${s}</span><b style="display:block;font-size:18px;margin-top:5px">${results.filter(x=>x.status===s).length}</b></div>`).join('')}</div>`:''}${results.map(res=>{let c=res.case_snapshot||state.cases.find(x=>x.id===res.case_id);if(!c)return '';return `<div class="execitem"><b>${esc(c.case_key)}</b><span class="case-title">${esc(c.title)}</span><p class="panel-sub">${esc(c.description||'')}</p><small>${esc(c.module)} · ${esc(c.priority)}</small><details><summary>Precondiciones, pasos y resultado esperado</summary><p><b>Descripción:</b> ${esc(c.description||'')}</p><p><b>Precondiciones:</b> ${esc(c.preconditions)}</p><p><b>Pasos:</b> ${esc(c.steps)}</p><p><b>Esperado:</b> ${esc(c.expected_result)}</p></details><div class="exec-controls"><select id="status-${res.id}">${['NOT_RUN','PASS','FAIL','BLOCKED','SKIPPED'].map(s=>`<option ${res.status===s?'selected':''}>${s}</option>`).join('')}</select><textarea id="actual-${res.id}" placeholder="Actual Result: record what happened during execution">${esc(res.actual||'')}</textarea><textarea id="comment-${res.id}" placeholder="Comment: notes, evidence reference or bug ID">${esc(res.comment||'')}</textarea><button class="save" data-save-result="${res.id}">Guardar resultado</button></div></div>`}).join('')}</section></div>`}

function howtoPage(){return heading('DOCUMENTACIÓN','Guía de uso','Guía rápida para nuevos integrantes del equipo QA y formatos oficiales de importación.')+`<section class="panel"><h2>1. Primeros pasos</h2><p class="noticebox">El catálogo contiene todos los casos disponibles. Las suites son agrupaciones reutilizables. Las ejecuciones son sesiones concretas que incluyen únicamente los casos seleccionados.</p><h2 style="margin-top:22px">2. Formatos de importación</h2><p class="noticebox">Se aceptan Excel (.xlsx), CSV (.csv) y JSON (.json). En Excel se lee la primera hoja. La primera fila debe contener los encabezados.</p><div class="tablewrap"><table><thead><tr><th>Campo</th><th>Obligatorio</th><th>Descripción</th></tr></thead><tbody>${[['case_key','Yes','Unique ID, e.g. RESP-GP-001'],['title','Yes','Test Case Title'],['description','Yes','Test Case Description / objective'],['module','Yes','Feature or application area'],['test_type','No','Happy path, Negative, Edge case, Smoke, Regression'],['priority','No','Crítica, Alta, Media, Baja'],['preconditions','No','State required before execution'],['steps','Yes','Reproducible actions; use numbered steps or semicolons'],['expected_result','Yes','Observable expected outcome'],['requirement_ref','No','Requirement, ticket, or source reference']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:22px">3. Importar casos</h2><ol class="noticebox"><li>Open <b>Casos de prueba</b> and choose <b>Importar casos</b>.</li><li>Select XLSX, CSV or JSON.</li><li>Review the preview and validation warnings.</li><li>Confirm import. Existing case_key values are skipped to prevent duplicates.</li><li>New cases become available in the global catalog and can be added to any suite.</li></ol><h2 style="margin-top:22px">4. Crear suites</h2><p class="noticebox">Create a suite and select cases from the catalog. Examples: Adult Guardian Golden Path, Protected Device Golden P holder="Qué ocurre actualmente"></textarea></label><label class="field">Expected Behavior<textarea name="expectedBehavior" required placeholder="Qué debería ocurrir"></textarea></label><label class="field">Additional Notes<textarea name="additionalNotes" placeholder="Información adicional, condiciones o contexto"></textarea></label><label class="field">Attachments<input name="attachments" type="file" multiple accept="image/*,video/*,.pdf,.txt,.log"><span class="noticebox">Se guardarán los nombres de los archivos seleccionados. Los archivos no se suben en esta versión.</span></label><label class="field">Component<input name="component" placeholder="Ej. Web filtering, onboarding, permissions"></label><label class="field">Affects Version<input name="affectsVersion" placeholder="Ej. 0.1.0"></label><label class="field">Fix Version<input name="fixVersion" placeholder="Versión donde se corregirá, si se conoce"></label><label class="field">Platform<select name="platform"><option selected>Android</option><option>Android Emulator</option><option>Web</option><option>iOS</option><option>Other</option></select></label><label class="field">Reproduction Rate<select name="reproductionRate"><option>100% (Always)</option><option>Frequent (70–99%)</option><option>Intermittent (30–69%)</option><option>Rare (1–29%)</option><option>Not reproduced</option></select></label><div class="modalactions"><button type="button" class="btn" data-action="cancel">Cancelar</button><button class="btn primary">Guardar bug</button></div></form></div>`;return `<div class="modalbg"><form class="modal" id="runform"><h2>Nueva ejecución</h2><label class="field">Nombre de ejecución<input name="name" required value="Sprint 1 - Smoke Android"></label><label class="field">Versión / build<input name="build" required value="0.1.0"></label><label class="field">Entorno<select name="environment"><option>Android / dispositivo o emulador</option><option>Android Emulator</option><option>Dispositivo físico Android</option async function refreshData(){const [c,r,res,d,s,sc]=await Promise.all([qaSupabase.from('qa_test_cases').select('*').order('case_key'),qaSupabase.from('qa_test_runs').select('*').order('created_at'),qaSupabase.from('qa_test_results').select('*').order('created_at'),qaSupabase.from('qa_defects').select('*').order('created_at'),qaSupabase.from('qa_test_suites').select('*').order('name'),qaSupabase.from('qa_test_suite_cases').select('*')]);for(const x of [c,r,res,d,s,sc])if(x.error)throw x.error;state={cases:c.data||[],runs:r.data||[],results:res.data||[],defects:d.data||[],suites:s.data||[],suiteCases:sc.data||[]};let nums=state.defects.map(x=>Number(String(x.bug_key||'').match(/(\d+)$/)?.[1]||0));state.nextBug=Math.max(1,...nums)+1;if(!selectedRun&&state.runs.length)selectedRun=state.runs[state.runs.length-1].id;}
async function seed(){try{const response=await fetch('./cases.json');if(!response.ok)throw new Error('No se pudo leer cases.json');const data=await response.json();const payload=data.map(c=>({...c,created_by:user.id}));const {error}=await qaSupabase.from('qa_test_cases').upsert(payload,{onConflict:'case_key',ignoreDuplicates:true});if(error)throw error;await refreshData();notice=`Carga inicial completada. Catálogo compartido: ${state.cases.length} casos.`;render()}catch(e){showError('No se pudieron cargar los casos: '+e.message)}}

const sampleCase={case_key:'RESP-FUN-XXX',title:'Título del caso de prueba',description:'Descripción del objetivo y alcance del escenario.',module:'Módulo',test_type:'Funcional',priority:'Alta',preconditions:'Estado requerido antes de ejecutar la prueba.',steps:'1. Abrir la aplicación.\n2. Realizar la acción.\n3. Verificar el resultado.',expected_result:'La aplicación muestra el comportamiento esperado.',requirement_ref:'REQ-001'};

const $$=s=>document.querySelectorAll(s);function updateSelectedCount(){const n=$$('#runCasePicker input:checked').length;const el=$('#selectedCaseCount');if(el)el.textContent=n+' seleccionados'}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.action==='newCase'){editingCaseId=null;showRun='case';render()}if(b.dataset.editCase){editingCaseId=b.dataset.editCase;showRun='caseEdit';render()}if(b.dataset.archiveCase){const c=state.cases.find(x=>String(x.id)===String(b.dataset.archiveCase));if(!c)return;if(!confirm(`¿Eliminar "${c.case_key}" del catálogo? Se conservarán las ejecuciones y resultados históricos.`))return;const {error}=await qaSupabase.from('qa_test_cases').update({is_active:false,archived_at:new Date().toISOString()}).eq('id',c.id).neq('is_active',false);if(error)throw error;await refreshData();notice='Caso archivado del catálogo. El historial se conservó.';render()}if(b.dataset.restoreCase){const c=state.cases.find(x=>String(x.id)===String(b.dataset.restoreCase));if(!c||c.is_active!==false)return;const {error}=await qaSupabase.from('qa_test_cases').update({is_active:true,archived_at:null}).eq('id',c.id).eq('is_active',false);if(error)throw error;await refreshData();page='deleted';notice=`${c.case_key} fue restaurado al catálogo.`;render()}if(b.dataset.action==='importMembership')$('#membershipImportInput')?.click();if(b.dataset.page){page=b.dataset.page;notice='';render()}if(b.dataset.action==='seed')await seed();if(b.dataset.action==='newrun')newRun();if(b.dataset.action==='newbug'){showRun='bug';render()}if(b.dataset.action==='cancel'){showRun=false;render()}if(b.dataset.action==='dismiss'){notice='';render()}if(b.dataset.action==='runs'){page='runs';render()}if(b.dataset.action==='cases'){page='cases';render()}if(b.dataset.action==='deleted'){page='deleted';render()}if(b.dataset.run){selectedRun=b.dataset.run;page='runs';render()}if(b.dataset.deleteRun){const id=b.dataset.deleteRun;const run=state.runs.find(x=>String(x.id)===String(id));if(!run)throw new Error('No se encontró la ejecución.');if(!confirm(`¿Eliminar la ejecución \"${run.name}\" y todos sus resultados? Esta acción no se puede deshacer.`))return;const {error:resultsError}=await qaSupabase.from('qa_test_results').delete().eq('run_id',id);if(resultsError)throw resultsError;const {error:runError}=await qaSupabase.from('qa_test_runs').delete().eq('id',id);if(runError)throw runError;await refreshData();if(String(selectedRun)===String(id))selectedRun=state.runs.length?state.runs[state.runs.length-1].id:null;notice='Ejecución y resultados asociados eliminados correctamente.';render()}if(b.dataset.saveResult){let id=b.dataset.saveResult;const r=state.results.find(x=>x.id===id);const status=$('#status-'+id).value,actual=$('#actual-'+id).value,comment=$('#comment-'+id)?.value||'';const {error}=await qaSupabase.from('qa_test_results').update({status,actual,comment,executed_by:user.id,executed_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await refreshData();notice=`Resultado guardado como ${status}.`;render()}if(b.dataset.action==='export'){download('ba-protege-qa-report.json',JSON.stringify(state,null,2),'application/json')}if(b.dataset.action==='exportBugs'){const bugs=state.defects.map(d=>({bugId:d.bug_id,key:d.bug_key,title:d.title,description:d.description,levelArea:d.level_area,severity:d.severity,status:d.status,steps:d.steps,actual:d.actual,expectedBehavior:d.expected_behavior,additionalNotes:d.additional_notes,attachments:d.attachments,component:d.component,affectsVersion:d.affects_version,fixVersion:d.fix_version,platform:d.platform,reproductionRate:d.reproduction_rate,createdAt:d.created_at}));download('ba-protege-qa-bugs.json',JSON.stringify({format:'ba-protege-qa-bugs',version:1,exportedAt:new Date().toISOString(),bugs},null,2),'application/json')}if(b.dataset.action==='importBugs')$('#bugImportInput')?.click();if(b.dataset.action==='csv'){let rows=[['ID','Título','Módulo','Tipo','Prioridad','Precondiciones','Pasos','Esperado','Referencia'],...state.cases.map(c=>[c.case_key,c.title,c.module,c.test_type,c.priority,c.preconditions,c.steps,c.expected_result,c.requirement_ref])];download('ba-protege-qa-cases.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}if(b.dataset.action==='importCases')$('#caseImportInput')?.click();if(b.dataset.action==='templateCsv')download('qa-test-case-template.csv',caseCsv([sampleCase]),'text/csv');if(b.dataset.action==='templateJson')download('qa-test-case-template.json',JSON.stringify([sampleCase],null,2),'application/json');if(b.dataset.action==='templateXlsx')downloadCaseXlsx();if(b.dataset.action==='newSuite'){showRun='suite';render()}if(b.dataset.action==='editSuite'){showRun='suiteEdit';render()}if(b.dataset.action==='deleteSuite'){const su=state.suites.find(x=>String(x.id)===String(selectedSuite));if(su&&confirm(`¿Eliminar la suite "${su.name}"? Los casos del catálogo y ejecuciones no se eliminarán.`)){const {error}=await qaSupabase.from('qa_test_suites').delete().eq('id',su.id);if(error)throw error;await refreshData();selectedSuite=null;notice='Suite eliminada.';render()}}if(b.dataset.action==='selectAllCases'){$$('#runCasePicker input').forEach(x=>x.checked=true);updateSelectedCount()}if(b.dataset.action==='clearCases'){$$('#runCasePicker input').forEach(x=>x.checked=false);updateSelectedCount()}if(b.dataset.suite){selectedSuite=b.dataset.suite;page='suites';render()}if(b.dataset.action==='logout'){await qaSupabase.auth.signOut();user=null;state={cases:[],runs:[],results:[],defects:[],suites:[],suiteCases:[]};render()}}catch(err){showError(err.message||'Ocurrió un error.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let inp=$('#search');inp.focus();inp.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='moduleFilter'){moduleFilter=e.target.value;render()}if(e.target.closest('#runCasePicker'))updateSelectedCount();if(e.target.id==='runSuiteSelect'){const ids=state.suiteCases.filter(x=>String(x.suite_id)===String(e.target.value)).map(x=>String(x.case_id));$$('#runCasePicker input').forEach(x=>x.checked=!e.target.value||ids.includes(x.value));updateSelectedCount()}});
document.addEventListener('change',async e=>{if(e.target.id==='caseImportInput'&&e.target.files?.length){try{const file=e.target.files[0],ext=file.name.split('.').pop().toLowerCase();let raw=[];if(ext==='json'){const j=JSON.parse(await file.text());raw=Array.isArray(j)?j:(Array.isArray(j.cases)?j.cases:[])}else if(ext==='csv'){const wb=XLSX.read(await file.text(),{type:'string'});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else if(ext==='xlsx'){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else throw new Error('Formato no soportado. Usá XLSX, CSV o JSON.');if(!raw.length)throw new Error('El archivo no contiene filas.');const aliases={id:'case_key',case_id:'case_key',test_case_id:'case_key',nombre:'title',titulo:'title',titulo_del_caso:'title',descripcion:'description',descripcion_del_caso:'description',modulo:'module',nombre_del_modulo:'module',tipo:'test_type',prioridad:'priority',precondiciones:'preconditions',pasos:'steps',pasos_de_prueba:'steps',resultado_esperado:'expected_result',esperado:'expected_result',referencia:'requirement_ref',referencia_requisito:'requirement_ref'};const normalized=raw.map(row=>{let o={};for(const [k,v] of Object.entries(row)){let key=String(k).replace(/^\uFEFF/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s-]+/g,'_');key=aliases[key]||key;o[key]=v}return o});const existing=new Set(state.cases.map(c=>String(c.case_key).toLowerCase()));const seen=new Set();let added=0,duplicates=0,invalid=0;const rows=[];for(const c of normalized){const key=String(c.case_key||'').trim().toLowerCase();if(!key||!String(c.title||'').trim()||!String(c.description||'').trim()||!String(c.module||'').trim()||!String(c.steps||'').trim()||!String(c.expected_result||'').trim()){invalid++;continue}if(existing.has(key)||seen.has(key)){duplicates++;continue}seen.add(key);rows.push({case_key:String(c.case_key).trim(),title:String(c.title).trim(),description:String(c.description).trim(),module:String(c.module).trim(),test_type:c.test_type||'Funcional',priority:c.priority||'Media',preconditions:c.preconditions||'',steps:c.steps,expected_result:c.expected_result,requirement_ref:c.requirement_ref||'',created_by:user.id,is_active:true})}if(rows.length){const {error}=await qaSupabase.from('qa_test_cases').insert(rows);if(error)throw error;added=rows.length}await refreshData();page='cases';notice=`Importación finalizada: ${added} agregados, ${duplicates} duplicados omitidos y ${invalid} filas inválidas.`;render()}catch(err){showError('No se pudo importar el archivo: '+err.message)}finally{e.target.value=''}}});

document.addEventListener('change',async e=>{if(e.target.id==='membershipImportInput'&&e.target.files?.length){try{const wb=XLSX.read(await e.target.files[0].text(),{type:'string'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('El CSV no contiene relaciones.');let added=0,missing=0;for(const row of rows){const suiteName=String(row.suite_name||row.nombre_suite||'').trim(),caseKey=String(row.case_key||row.id_caso||'').trim();if(!suiteName||!caseKey){missing++;continue}let suite=state.suites.find(x=>x.name.toLowerCase()===suiteName.toLowerCase());if(!suite){const {data,error}=await qaSupabase.from('qa_test_suites').insert({name:suiteName,description:String(row.purpose||row.proposito||''),created_by:user.id}).select().single();if(error)throw error;suite=data;state.suites.push(suite)}const testCase=state.cases.find(x=>x.case_key.toLowerCase()===caseKey.toLowerCase());if(!testCase){missing++;continue}const exists=state.suiteCases.some(x=>String(x.suite_id)===String(suite.id)&&String(x.case_id)===String(testCase.id));if(exists)continue;const {error}=await qaSupabase.from('qa_test_suite_cases').insert({suite_id:suite.id,case_id:testCase.id,created_by:user.id});if(error)throw error;added++}await refreshData();page='suites';notice=`Pertenencia importada: ${added} relaciones nuevas; ${missing} filas sin suite o caso válido. Las relaciones existentes se conservaron.`;render()}catch(err){showError('No se pudo importar la pertenencia a suites: '+err.message)}finally{e.target.value=''}}});
document.addEventListener('change',async e=>{if(e.target.id!=='bugImportInput'||!e.target.files?.length)return;try{const parsed=JSON.parse(await e.target.files[0].text());const incoming=Array.isArray(parsed)?parsed:(parsed?.format==='ba-protege-qa-bugs'&&Array.isArray(parsed.bugs)?parsed.bugs:(Array.isArray(parsed?.defects)?parsed.defects:null));if(!incoming)throw new Error('El archivo no contiene una lista de bugs reconocible.');let added=0,skipped=0;const fingerprints=new Set(state.defects.map(bugFingerprint));const rows=[];let next=state.nextBug;for(const raw of incoming){if(!raw||!String(raw.title||'').trim()){skipped++;continue}if(fingerprints.has(bugFingerprint(raw))){skipped++;continue}fingerprints.add(bugFingerprint(raw));rows.push({bug_id:raw.bugId||makeBugId(),bug_key:'BUG-'+String(next++).padStart(4,'0'),title:String(raw.title).trim(),description:raw.description||'',level_area:raw.levelArea||raw.level_area||'',severity:raw.severity||'Major',status:raw.status||'OPEN',steps:raw.steps||'',actual:raw.actual||'',expected_behavior:raw.expectedBehavior||raw.expected_behavior||'',additional_notes:raw.additionalNotes||raw.additional_notes||'',attachments:Array.isArray(raw.attachments)?raw.attachments:[],component:raw.component||'',affects_version:raw.affectsVersion||raw.affects_version||'',fix_version:raw.fixVersion||raw.fix_version||'',platform:raw.platform||'Android',reproduction_rate:raw.reproductionRate||raw.reproduction_rate||'',created_by:user.id});added++}if(rows.length){const {error}=await qaSupabase.from('qa_defects').insert(rows);if(error)throw error}await refreshData();page='defects';notice=`Importación completada: ${added} bugs nuevos, ${skipped} omitidos (duplicados o inválidos).`;render()}catch(err){showError('No se pudo importar: '+err.message)}finally{e.target.value=''}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;try{if(f.id==='loginform'){const data=Object.fromEntries(new FormData(f));const {data:authData,error}=await qaSupabase.auth.signInWithPassword({email:data.email.trim(),password:data.password});if(error)throw error;user=authData.user;await refreshData();notice='Sesión iniciada correctamente.';render()}if(f.id==='caseform'){const data=Object.fromEntries(new FormData(f));const payload={...data,created_by:user.id,is_active:true};let result;if(showRun==='caseEdit'){const {error}=await qaSupabase.from('qa_test_cases').update({title:payload.title,description:payload.description,module:payload.module,test_type:payload.test_type,priority:payload.priority,preconditions:payload.preconditions,steps:payload.steps,expected_result:payload.expected_result,requirement_ref:payload.requirement_ref}).eq('id',editingCaseId);if(error)throw error;result='Caso actualizado. Los resultados históricos no se modificaron.'}else{const {error}=await qaSupabase.from('qa_test_cases').insert(payload);if(error)throw error;result='Caso creado y agregado al catálogo.'}await refreshData();showRun=false;page='cases';notice=result;render()}if(f.id==='suiteform'){const data=Object.fromEntries(new FormData(f));const ids=[...f.querySelectorAll('input[name=suite_case_ids]:checked')].map(x=>x.value);if(!ids.length)throw new Error('Seleccioná al menos un caso para la suite.');let suite;if(showRun==='suiteEdit'){const {data:updated,error}=await qaSupabase.from('qa_test_suites').update({name:data.name,description:data.description||''}).eq('id',selectedSuite).select().single();if(error)throw error;suite=updated;const {error:delError}=await qaSupabase.from('qa_test_suite_cases').delete().eq('suite_id',selectedSuite);if(delError)throw delError}else{const {data:created,error}=await qaSupabase.from('qa_test_suites').insert({name:data.name,description:data.description||'',created_by:user.id}).select().single();if(error)throw error;suite=created}const rows=ids.map(case_id=>({suite_id:suite.id,case_id,created_by:user.id}));const {error:linkError}=await qaSupabase.from('qa_test_suite_cases').insert(rows);if(linkError)throw linkError;await refreshData();selectedSuite=suite.id;page='suites';showRun=false;notice='Suite guardada correctamente.';render()}if(f.id==='runform'){ const data=Object.fromEntries(new FormData(f));const {data:run,error}=await qaSupabase.from('qa_test_runs').insert({name:data.name,build:data.build,environment:data.environment,created_by:user.id}).select().single();if(error)throw error;const selectedIds=[...f.querySelectorAll('input[name=case_ids]:checked')].map(x=>x.value);if(!selectedIds.length)throw new Error('Seleccioná al menos un caso para la ejecución.');const chosen=state.cases.filter(c=>selectedIds.includes(String(c.id)));const rows=chosen.map(c=>({run_id:run.id,case_id:c.id,status:'NOT_RUN',actual:'',comment:'',case_snapshot:c,created_by:user.id}));if(rows.length){const {error:resultError}=await qaSupabase.from('qa_test_results').insert(rows);if(resultError)throw resultError}await refreshData();selectedRun=run.id;page='runs';showRun=false;notice=`Ejecución creada con ${rows.length} casos seleccionados.`;render()}if(f.id==='bugform'){const fd=new FormData(f),data=Object.fromEntries(fd),attachments=[...(f.elements.attachments.files||[])].map(file=>file.name);const {error}=await qaSupabase.from('qa_defects').insert({bug_id:makeBugId(),bug_key:'BUG-'+String(state.nextBug++).padStart(4,'0'),title:data.title,description:data.description,level_area:data.levelArea,severity:data.severity,status:'OPEN',steps:data.steps,actual:data.actual,expected_behavior:data.expectedBehavior,additional_notes:data.additionalNotes,attachments,component:data.component,affects_version:data.affectsVersion,fix_version:data.fixVersion,platform:data.platform,reproduction_rate:data.reproductionRate,created_by:user.id});if(error)throw error;await refreshData();showRun=false;notice='Bug registrado correctamente.';render()}}catch(err){if(f.id==='loginform'){$('#root').innerHTML=loginView(err.message)}else showError(err.message||'No se pudo guardar la información.')}});
(async()=>{const {data:{session}}=await qaSupabase.auth.getSession();if(session?.user){user=session.user;try{await refreshData()}catch(e){notice=e.message}}render()})();
