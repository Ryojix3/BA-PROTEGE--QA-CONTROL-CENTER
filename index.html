<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BA Protege+ | QA Control Center</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#193544;background:#f4f7f9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:235px;background:#102d3a;color:#dbe7eb;padding:23px 13px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 28px}.mark{width:40px;height:40px;background:#c8f2e0;color:#12694f;border-radius:12px;display:grid;place-items:center;font-size:21px}.brand b{display:block;color:white;font-size:15px}.brand small{color:#9db6c0;font-size:11px}.muted-label{font-size:10px;letter-spacing:1px;color:#86a0ab;padding:0 10px 10px}.project{background:#1e414f;border:1px solid #315360;padding:11px;border-radius:8px;font-size:12px;margin-bottom:22px}.nav button{display:flex;gap:11px;align-items:center;width:100%;padding:12px;border:0;background:transparent;color:#b1c4cc;border-radius:8px;text-align:left;font-size:13px;margin:3px 0}.nav button.active,.nav button:hover{background:#254958;color:white}.nav button.active{box-shadow:inset 3px 0 #72dfb6}.sidefoot{margin-top:auto;border-top:1px solid #2c4c59;padding:18px 9px 0;font-size:11px;color:#a3bac4}.main{flex:1;min-width:0}.top{height:64px;background:white;border-bottom:1px solid #e5ebee;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:12px;color:#81929b}.top strong{color:#264553}.tag{background:#e6f7ef;color:#187454;border-radius:6px;padding:7px 10px}.content{max-width:1500px;margin:auto;padding:28px 30px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px}.eyebrow{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#3a9a78}.heading h1{font-size:28px;letter-spacing:-.7px;margin:7px 0;color:#163544}.heading p{font-size:13px;color:#778993;margin:0}.btn{border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700;display:inline-flex;gap:7px;align-items:center;border:1px solid #dbe4e8;background:#fff;color:#2d4c5a}.btn.primary{background:#13815e;color:white;border-color:#13815e}.btn:hover{filter:brightness(.97)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.stat,.panel{background:white;border:1px solid #e4ebee;border-radius:12px;box-shadow:0 2px 8px #203c4b05}.stat{padding:17px}.stat label{font-size:12px;color:#6d808a}.stat strong{display:block;font-size:27px;margin:12px 0 4px;color:#173948}.stat small{font-size:10px;color:#8a99a1}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:17px}.panel{padding:19px;min-width:0}.panel h2{font-size:15px;margin:0;color:#1d3c4b}.panel-sub{font-size:11px;color:#8998a0;margin:6px 0 0}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.barrow{display:grid;grid-template-columns:75px 1fr 25px;align-items:center;gap:8px;margin:15px 0;font-size:11px;color:#627984}.bar{height:8px;border-radius:8px;background:#eef2f4;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}.quick{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#f8fffb}.quick p{font-size:12px;line-height:1.6;color:#738791;max-width:600px}.filters{display:flex;gap:9px;align-items:center;margin-bottom:15px}.filters input,.filters select,.field input,.field textarea,.field select,.inline-input{border:1px solid #dce5e9;border-radius:8px;padding:10px;font-size:12px;background:#fff;color:#2b4a58;min-width:0}.filters input{flex:1}.filters select{max-width:240px}.count{font-size:11px;color:#81919a;margin-left:auto;white-space:nowrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#f8fafb;font-size:9px;letter-spacing:.5px;color:#81929b;padding:12px 9px;white-space:nowrap}td{padding:12px 9px;border-bottom:1px solid #edf1f3;font-size:11px;color:#607580;vertical-align:top}td strong{color:#18815e;font-size:10px}.titlecell{font-weight:650;color:#2b4856;font-size:12px;min-width:190px}details{margin-top:7px;font-size:10px;line-height:1.5;max-width:450px}summary{cursor:pointer;color:#17815d;font-weight:700}.pill{display:inline-block;padding:5px 7px;border-radius:5px;background:#f0f4f6;color:#5d7480;font-size:9px;white-space:nowrap}.priority{font-size:10px;white-space:nowrap}.priority.critical{color:#c13c49}.priority.high{color:#ad7915}.priority.medium{color:#287b9b}.notice{padding:11px 13px;border:1px solid #cce8d9;background:#effaf4;color:#1c7556;border-radius:8px;font-size:12px;margin-bottom:15px;display:flex;justify-content:space-between}.notice button{border:0;background:none;color:inherit}.runlayout{display:grid;grid-template-columns:240px 1fr;gap:15px}.runchoice{display:block;width:100%;text-align:left;border:1px solid transparent;background:white;padding:12px;border-radius:8px;margin-top:6px}.runchoice.selected{background:#eef9f3;border-color:#cbe9d9}.runchoice b,.runchoice span{display:block}.runchoice b{font-size:11px;color:#2c4957}.runchoice span{font-size:10px;color:#16815e;margin-top:5px}.execitem{padding:14px 0;border-bottom:1px solid #edf1f3}.execitem:last-child{border-bottom:0}.execitem b{font-size:10px;color:#17815d}.execitem .case-title{font-size:12px;color:#294654;font-weight:700;margin-left:8px}.execitem small{display:block;color:#83939b;margin-top:5px}.exec-controls{display:grid;grid-template-columns:110px 1fr 75px;gap:7px;margin-top:10px}.exec-controls input,.exec-controls select{padding:8px;border:1px solid #dfe6e9;border-radius:7px;font-size:10px;min-width:0}.save{border:0;background:#e5f6ed;color:#167854;border-radius:7px;font-weight:700;font-size:10px}.modalbg{position:fixed;inset:0;background:#102a39aa;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(680px,100%);max-height:calc(100vh - 40px);overflow-y:auto;background:white;border-radius:13px;padding:23px}.modal h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:7px;margin:12px 0;font-size:11px;font-weight:700;color:#526b77}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:75px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.defectrow{padding:13px 0;border-bottom:1px solid #edf1f3}.defectrow b{font-size:11px}.defectrow p{font-size:11px;color:#7b8b94}.empty{padding:25px;text-align:center;color:#81919a;font-size:12px}.noticebox{font-size:11px;color:#7e8e97;line-height:1.6}.footnote{font-size:10px;color:#87969e;line-height:1.6;margin-top:12px}
@media(max-width:1000px){.side{width:190px}.content{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.quick{align-items:flex-start;flex-direction:column}}
@media(max-width:680px){.side{width:60px;padding:15px 6px}.brand{padding:0 3px 25px}.brand>div:last-child,.muted-label,.project,.nav button span,.sidefoot{display:none}.nav button{justify-content:center;padding:13px 4px}.top{padding:0 13px}.content{padding:19px 12px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:24px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.runlayout{grid-template-columns:1fr}.filters{flex-wrap:wrap}.filters input{flex-basis:100%}.filters select{flex:1}.exec-controls{grid-template-columns:1fr 1fr}.exec-controls input{grid-column:1/3;grid-row:2}.save{grid-column:2;grid-row:1;padding:8px}}
</style></head>
<body><div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='baProtegeQaV1';
let state=JSON.parse(localStorage.getItem(key)||'null')||{cases:[],runs:[],results:[],defects:[],nextRun:1,nextResult:1,nextBug:1};
let page='dashboard',selectedRun=null,notice='',showRun=false,search='',moduleFilter='Todos';
function save(){localStorage.setItem(key,JSON.stringify(state))}
async function seed(){const data=await fetch('./cases.json').then(r=>r.json());let known=new Set(state.cases.map(c=>c.case_key));let add=data.filter(c=>!known.has(c.case_key)).map((c,i)=>({...c,id:Math.max(0,...state.cases.map(x=>x.id))+i+1}));state.cases.push(...add);save();notice=`Carga inicial completada: ${add.length} casos nuevos (${state.cases.length} en total).`;render()}
function nav(){return `<aside class="side"><div class="brand"><div class="mark">✓</div><div><b>BA Protege+</b><small>QA Control Center</small></div></div><div class="muted-label">WORKSPACE</div><div class="project">● Protección parental</div><div class="nav">${[['dashboard','▦','Dashboard'],['cases','☷','Casos de prueba'],['runs','▷','Ejecuciones'],['defects','⚑','Bugs'],['reports','▤','Reportes']].map(([id,ico,label])=>`<button class="${page===id?'active':''}" data-page="${id}"><span>${ico}</span><span>${label}</span></button>`).join('')}</div><div class="sidefoot">QA Workspace · Datos guardados en este navegador</div></aside>`}
function heading(k,title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function btn(label,cls,action){return `<button class="btn ${cls||''}" data-action="${action}">${label}</button>`}
function stats(){let statuses=state.results.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{});let open=state.defects.filter(d=>!['CLOSED','RESOLVED'].includes(d.status));return `<div class="stats">${[['Casos de prueba',state.cases.length,'Casos en catálogo'],['Ejecuciones',state.runs.length,'Sesiones registradas'],['Bugs abiertos',open.length,'Pendientes de resolución'],['Bugs críticos',open.filter(d=>['Critical','Blocker'].includes(d.severity)).length,'Riesgo de release']].map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
function dashboard(){let statuses=state.results.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{}),pass=statuses.PASS||0,fail=statuses.FAIL||0,rate=pass+fail?Math.round(pass/(pass+fail)*100):0;return heading('OVERVIEW / SPRINT QA','Dashboard','Estado de calidad y actividad de testing de BA Protege+.',btn('＋ Nueva ejecución','primary','newrun'))+stats()+`<div class="two"><section class="panel"><h2>Resultados de testing</h2><p class="panel-sub">Resultados registrados en todas las ejecuciones</p><div style="display:flex;align-items:center;justify-content:space-between;padding:25px 12px"><div><strong style="font-size:32px;color:#16815e">${rate}%</strong><div class="panel-sub">Pass rate</div></div><div style="font-size:28px;color:#2b5966">${pass+fail+ (statuses.BLOCKED||0)+(statuses.NOT_RUN||0)}</div></div>${[['PASS',pass,'#15966b'],['FAIL',fail,'#d9485f'],['BLOCKED',statuses.BLOCKED||0,'#d99a24'],['NOT RUN',statuses.NOT_RUN||0,'#98a2b3']].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bar"><i style="width:${state.results.length?x[1]/state.results.length*100:0}%;background:${x[2]}"></i></div><b>${x[1]}</b></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h2>Actividad reciente</h2><p class="panel-sub">Últimas ejecuciones</p></div>${btn('Ver todas','','runs')}</div>${state.runs.slice().reverse().slice(0,5).map(r=>`<div class="defectrow"><b>${esc(r.name)}</b><p>Build ${esc(r.build)} · ${esc(r.environment)}</p></div>`).join('')||'<div class="empty">Todavía no hay ejecuciones.</div>'}</section></div><section class="panel quick"><div><div class="eyebrow">PRIMEROS PASOS</div><h2 style="margin-top:8px">Prepará tu espacio de QA</h2><p>Cargá los casos base derivados del brief y creá una ejecución para registrar resultados manuales de Android.</p></div><div>${btn('⇩ Cargar casos iniciales','', 'seed')} ${btn('＋ Crear ejecución','primary','newrun')}</div></section>`}
function casesPage(){let mods=['Todos',...new Set(state.cases.map(c=>c.module))];let filtered=state.cases.filter(c=>(moduleFilter==='Todos'||c.module===moduleFilter)&&`${c.case_key} ${c.title} ${c.module}`.toLowerCase().includes(search.toLowerCase()));return heading('TEST MANAGEMENT','Casos de prueba','Catálogo de escenarios de BA Protege+.',btn('⇩ Cargar casos iniciales','','seed'))+`<section class="panel"><div class="filters"><input id="search" placeholder="Buscar por ID, título o módulo..." value="${esc(search)}"><select id="moduleFilter">${mods.map(m=>`<option ${m===moduleFilter?'selected':''}>${esc(m)}</option>`).join('')}</select><span class="count">${filtered.length} casos</span></div><div class="tablewrap"><table><thead><tr><th>ID / TÍTULO</th><th>MÓDULO</th><th>TIPO</th><th>PRIORIDAD</th><th>REFERENCIA</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><strong>${esc(c.case_key)}</strong><div class="titlecell">${esc(c.title)}</div><details><summary>Ver pasos y esperado</summary><p><b>Precondiciones:</b> ${esc(c.preconditions)}</p><p><b>Pasos:</b> ${esc(c.steps)}</p><p><b>Resultado esperado:</b> ${esc(c.expected_result)}</p></details></td><td>${esc(c.module)}</td><td><span class="pill">${esc(c.test_type)}</span></td><td><span class="priority ${c.priority==='Crítica'?'critical':c.priority==='Alta'?'high':'medium'}">● ${esc(c.priority)}</span></td><td>${esc(c.requirement_ref)}</td></tr>`).join('')}</tbody></table>${filtered.length?'':'<div class="empty">No hay casos. Cargá los casos iniciales.</div>'}</div></section>`}
function newRun(){showRun=true;render()}
function runsPage(){let r=state.runs.find(x=>x.id===selectedRun);let results=state.results.filter(x=>x.runId===selectedRun);return heading('TEST EXECUTION','Ejecuciones manuales','Registrá resultados por build sin perder el historial.',btn('＋ Nueva ejecución','primary','newrun'))+`<div class="runlayout"><section class="panel"><h2>Sesiones</h2>${state.runs.slice().reverse().map(x=>`<button class="runchoice ${selectedRun===x.id?'selected':''}" data-run="${x.id}"><b>${esc(x.name)}</b><span>Build ${esc(x.build)}</span></button>`).join('')||'<div class="empty">No hay sesiones creadas.</div>'}</section><section class="panel"><div class="panel-head"><div><h2>${r?esc(r.name):'Seleccioná una ejecución'}</h2><p class="panel-sub">${r?'Build '+esc(r.build)+' · '+esc(r.environment):'Creá una ejecución para habilitar resultados.'}</p></div></div>${r?`<div class="barrow" style="grid-template-columns:repeat(4,1fr);margin:18px 0">${['PASS','FAIL','BLOCKED','NOT_RUN'].map(s=>`<div><span>${s}</span><b style="display:block;font-size:18px;margin-top:5px">${results.filter(x=>x.status===s).length}</b></div>`).join('')}</div>`:''}${results.map(res=>{let c=state.cases.find(x=>x.id===res.caseId);if(!c)return '';return `<div class="execitem"><b>${esc(c.case_key)}</b><span class="case-title">${esc(c.title)}</span><small>${esc(c.module)} · ${esc(c.priority)}</small><details><summary>Precondiciones y resultado esperado</summary><p>${esc(c.preconditions)}</p><p><b>Pasos:</b> ${esc(c.steps)}</p><p><b>Esperado:</b> ${esc(c.expected_result)}</p></details><div class="exec-controls"><select id="status-${res.id}">${['NOT_RUN','PASS','FAIL','BLOCKED','SKIPPED'].map(s=>`<option ${res.status===s?'selected':''}>${s}</option>`).join('')}</select><input id="actual-${res.id}" placeholder="Resultado real / observaciones" value="${esc(res.actual||'')}"><button class="save" data-save-result="${res.id}">Guardar</button></div></div>`}).join('')}</section></div>`}
function defectsPage(){return heading('DEFECT MANAGEMENT','Bug tracker','Registro de defectos detectados durante las ejecuciones.',`<div style="display:flex;gap:8px;flex-wrap:wrap">${btn('⇧ Importar bugs','','importBugs')}${btn('⇩ Exportar bugs JSON','','exportBugs')}${btn('＋ Registrar bug','primary','newbug')}</div>`)+`<input id="bugImportInput" type="file" accept="application/json,.json" hidden><section class="panel"><p class="noticebox">Exportá tus bugs a un archivo JSON y compartilo con el otro tester. Al importar, los bugs nuevos se agregan y los que ya existen se omiten para evitar duplicados. Los archivos adjuntos se sincronizan solo como nombres, no como archivos.</p>${state.defects.slice().reverse().map(d=>`<div class="defectrow"><b>${esc(d.key)} · ${esc(d.title)}</b><p>${esc(d.severity||'Sin severidad')} · ${esc(d.status)} · ${esc(d.component||'Sin componente')} · ${esc(d.platform||'Sin plataforma')}</p>${d.description?`<p><b>Description:</b> ${esc(d.description)}</p>`:''}<details><summary>Ver reporte completo</summary><p><b>Level - Area:</b> ${esc(d.levelArea)}</p><p><b>Steps to reproduce:</b> ${esc(d.steps)}</p><p><b>Current Behavior:</b> ${esc(d.actual)}</p><p><b>Expected Behavior:</b> ${esc(d.expectedBehavior)}</p><p><b>Additional Notes:</b> ${esc(d.additionalNotes)}</p><p><b>Attachments:</b> ${esc((d.attachments||[]).join(', ')||'Ninguno')}</p><p><b>Component:</b> ${esc(d.component)}</p><p><b>Affects Version:</b> ${esc(d.affectsVersion)}</p><p><b>Fix Version:</b> ${esc(d.fixVersion)}</p><p><b>Platform:</b> ${esc(d.platform)}</p><p><b>Reproduction Rate:</b> ${esc(d.reproductionRate)}</p></details></div>`).join('')||'<div class="empty">Todavía no hay bugs registrados. Usá “Registrar bug” para agregar uno.</div>'}</section>`}
function reportsPage(){let s=state.results.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{}),p=s.PASS||0,f=s.FAIL||0;return heading('QUALITY REPORTING','Reportes','Resumen de QA exportable.',btn('⇩ Descargar JSON','','export'))+stats()+`<section class="panel"><h2>Resumen del proyecto</h2><p class="noticebox">Los indicadores se calculan a partir de los datos almacenados localmente. La cobertura formal de requisitos debe completarse con una matriz de trazabilidad validada por QA.</p><p class="footnote">PASS: ${p} · FAIL: ${f} · BLOCKED: ${s.BLOCKED||0} · SKIPPED: ${s.SKIPPED||0} · NOT RUN: ${s.NOT_RUN||0}</p>${btn('⇩ Exportar casos CSV','','csv')}</section>`}
function modal(){if(!showRun)return '';if(showRun==='bug')return `<div class="modalbg"><form class="modal" id="bugform"><h2>Registrar bug</h2><label class="field">Title<input name="title" required placeholder="Ej. El dominio sigue accesible"></label><label class="field">Description<textarea name="description" placeholder="Resumen del problema y su impacto"></textarea></label><label class="field">Level - Area<input name="levelArea" placeholder="Ej. High - Web filtering"></label><label class="field">Severity<select name="severity"><option>Blocker</option><option>Critical</option><option selected>Major</option><option>Minor</option><option>Trivial</option></select></label><label class="field">Steps to reproduce<textarea name="steps" required placeholder="1. ...&#10;2. ..."></textarea></label><label class="field">Current Behavior<textarea name="actual" required placeholder="Qué ocurre actualmente"></textarea></label><label class="field">Expected Behavior<textarea name="expectedBehavior" required placeholder="Qué debería ocurrir"></textarea></label><label class="field">Additional Notes<textarea name="additionalNotes" placeholder="Información adicional, condiciones o contexto"></textarea></label><label class="field">Attachments<input name="attachments" type="file" multiple accept="image/*,video/*,.pdf,.txt,.log"><span class="noticebox">Se guardarán los nombres de los archivos seleccionados. Los archivos no se suben ni se sincronizan en esta versión.</span></label><label class="field">Component<input name="component" placeholder="Ej. Web filtering, onboarding, permissions"></label><label class="field">Affects Version<input name="affectsVersion" placeholder="Ej. 0.1.0"></label><label class="field">Fix Version<input name="fixVersion" placeholder="Versión donde se corregirá, si se conoce"></label><label class="field">Platform<select name="platform"><option selected>Android</option><option>Android Emulator</option><option>Web</option><option>iOS</option><option>Other</option></select></label><label class="field">Reproduction Rate<select name="reproductionRate"><option>100% (Always)</option><option>Frequent (70–99%)</option><option>Intermittent (30–69%)</option><option>Rare (1–29%)</option><option>Not reproduced</option></select></label><div class="modalactions"><button type="button" class="btn" data-action="cancel">Cancelar</button><button class="btn primary">Guardar bug</button></div></form></div>`;return `<div class="modalbg"><form class="modal" id="runform"><h2>Nueva ejecución</h2><label class="field">Nombre de ejecución<input name="name" required value="Sprint 1 - Smoke Android"></label><label class="field">Versión / build<input name="build" required value="0.1.0"></label><label class="field">Entorno<select name="environment"><option>Android / dispositivo o emulador</option><option>Android Emulator</option><option>Dispositivo físico Android</option><option>Staging</option></select></label><p class="noticebox">Se guardará una copia de los casos actuales. Las ejecuciones anteriores no se sobrescriben.</p><div class="modalactions"><button type="button" class="btn" data-action="cancel">Cancelar</button><button class="btn primary">Crear ejecución</button></div></form></div>`}
function render(){let body=page==='dashboard'?dashboard():page==='cases'?casesPage():page==='runs'?runsPage():page==='defects'?defectsPage():reportsPage();$('#root').innerHTML=`<div class="app">${nav()}<main class="main"><header class="top"><span>Proyectos　/　<strong>BA Protege+</strong></span><span class="tag">Android · Manual</span></header><div class="content">${notice?`<div class="notice">${esc(notice)}<button data-action="dismiss">×</button></div>`:''}${body}</div></main>${modal()}</div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;notice='';render()}if(b.dataset.action==='seed')seed();if(b.dataset.action==='newrun')newRun();if(b.dataset.action==='newbug'){showRun='bug';render()}if(b.dataset.action==='cancel'){showRun=false;render()}if(b.dataset.action==='dismiss'){notice='';render()}if(b.dataset.action==='runs'){page='runs';render()}if(b.dataset.run){selectedRun=Number(b.dataset.run);page='runs';render()}if(b.dataset.saveResult){let id=Number(b.dataset.saveResult),r=state.results.find(x=>x.id===id);r.status=$('#status-'+id).value;r.actual=$('#actual-'+id).value;r.executedAt=new Date().toISOString();save();notice=`${r.caseId}: resultado guardado como ${r.status}.`;render()}if(b.dataset.action==='export'){download('ba-protege-qa-report.json',JSON.stringify(state,null,2),'application/json')}if(b.dataset.action==='exportBugs'){let bugs=state.defects.map(d=>({...d,bugId:d.bugId||makeBugId()}));state.defects=state.defects.map((d,i)=>({...d,bugId:bugs[i].bugId}));save();download('ba-protege-qa-bugs.json',JSON.stringify({format:'ba-protege-qa-bugs',version:1,exportedAt:new Date().toISOString(),bugs},null,2),'application/json');notice='Exportación de bugs preparada.';render()}if(b.dataset.action==='importBugs'){$('#bugImportInput')?.click()}if(b.dataset.action==='csv'){let rows=[['ID','Título','Módulo','Tipo','Prioridad','Precondiciones','Pasos','Esperado','Referencia'],...state.cases.map(c=>[c.case_key,c.title,c.module,c.test_type,c.priority,c.preconditions,c.steps,c.expected_result,c.requirement_ref])];download('ba-protege-qa-cases.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv') }});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let inp=$('#search');inp.focus();inp.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='moduleFilter'){moduleFilter=e.target.value;render()}});
document.addEventListener('change',async e=>{if(e.target.id!=='bugImportInput'||!e.target.files?.length)return;const file=e.target.files[0];try{const parsed=JSON.parse(await file.text());const incoming=Array.isArray(parsed)?parsed:(parsed?.format==='ba-protege-qa-bugs'&&Array.isArray(parsed.bugs)?parsed.bugs:(Array.isArray(parsed?.defects)?parsed.defects:null));if(!incoming)throw new Error('El archivo no contiene una lista de bugs reconocible.');let added=0,skipped=0,remapped=0;const existingIds=new Set(state.defects.map(d=>d.bugId).filter(Boolean));const fingerprints=new Set(state.defects.map(bugFingerprint));const keys=new Set(state.defects.map(d=>d.key).filter(Boolean));let maxKey=Math.max(state.nextBug-1,...state.defects.map(d=>Number(String(d.key||'').match(/(\d+)$/)?.[1]||0)));for(const raw of incoming){if(!raw||typeof raw!=='object'||!String(raw.title||'').trim()){skipped++;continue}const d={...raw,bugId:raw.bugId||makeBugId(),title:String(raw.title).trim(),attachments:Array.isArray(raw.attachments)?raw.attachments.map(String):[],status:raw.status||'OPEN',createdAt:raw.createdAt||new Date().toISOString()};const fp=bugFingerprint(d);if(existingIds.has(d.bugId)||fingerprints.has(fp)){skipped++;continue}const originalKey=d.key||'BUG-IMPORT';if(!d.key||keys.has(d.key)){maxKey++;d.key='BUG-'+String(maxKey).padStart(4,'0');d.importedFromKey=originalKey;remapped++}keys.add(d.key);existingIds.add(d.bugId);fingerprints.add(fp);state.defects.push(d);added++}state.nextBug=Math.max(state.nextBug,maxKey+1);save();page='defects';notice=`Importación completada: ${added} bugs nuevos, ${skipped} omitidos (duplicados o inválidos)${remapped?`, ${remapped} IDs renumerados por conflicto`:''}.`;render()}catch(err){notice='No se pudo importar el archivo: '+err.message;render()}finally{e.target.value=''}});
function makeBugId(){return 'bug-'+(globalThis.crypto?.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2))}
function bugFingerprint(d){const norm=v=>String(v??'').toLowerCase().trim().replace(/\s+/g,' ');return [norm(d.title),norm(d.steps),norm(d.component),norm(d.platform),norm(d.actual),norm(d.expectedBehavior)].join('|')}
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='runform'){let data=Object.fromEntries(new FormData(f));let run={id:state.nextRun++,name:data.name,build:data.build,environment:data.environment,createdAt:new Date().toISOString()};state.runs.push(run);state.cases.forEach(c=>state.results.push({id:state.nextResult++,runId:run.id,caseId:c.id,status:'NOT_RUN',actual:'',executedAt:''}));selectedRun=run.id;page='runs';showRun=false;save();notice='Ejecución creada con snapshot de los casos actuales.';render()}if(f.id==='bugform'){let fd=new FormData(f);let data=Object.fromEntries(fd);let attachments=[...(f.elements.attachments.files||[])].map(file=>file.name);state.defects.push({bugId:makeBugId(),key:'BUG-'+String(state.nextBug++).padStart(4,'0'),title:data.title,description:data.description,levelArea:data.levelArea,severity:data.severity,status:'OPEN',steps:data.steps,actual:data.actual,expectedBehavior:data.expectedBehavior,additionalNotes:data.additionalNotes,attachments,component:data.component,affectsVersion:data.affectsVersion,fixVersion:data.fixVersion,platform:data.platform,reproductionRate:data.reproductionRate,createdAt:new Date().toISOString()});showRun=false;save();notice='Bug registrado correctamente.';render()}});
function download(name,data,type){let blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
